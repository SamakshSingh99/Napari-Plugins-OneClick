name: napari-flim-phasor

channels:
  - conda-forge

dependencies:
  - python=3.11.13
  - pip
  - pip:
      # Python 3.11 and napari 0.5 stay within the plugin's published range.
      # napari-clusters-plotter 0.8.1 requires NumPy <=1.23.5.
      - numpy==1.23.5
      - scipy==1.15.3
      - pandas==2.3.3
      - scikit-image==0.21.0
      - scikit-learn==1.6.1
      - hdbscan==0.8.36
      - numba==0.58.1
      - rocket-fft==0.2.5
      # Python 3.11/Apple Silicon reader wheels compatible with this stack.
      - ptufile==2024.5.24
      - sdtfile==2024.5.24
      - dask==2023.12.1
      - zarr==2.16.1
      - numcodecs==0.12.1
      - napari==0.5.6
      - magicgui==0.10.1
      - QtPy==2.4.3
      - PyQt5==5.15.11
      - napari-clusters-plotter==0.8.1
      - napari-flim-phasor-plotter==0.2.3
