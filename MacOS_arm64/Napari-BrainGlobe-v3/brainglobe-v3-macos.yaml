name: brainglobe-v3

channels:
  - conda-forge

dependencies:
  - python=3.12.11
  - pip
  # BrainGlobe v3 supports napari >=0.6.1; lock the tested 0.6 series.
  - napari=0.6.6
  - pyqt6
  # Required by brainreg on macOS.
  - niftyreg
  - pip:
      # Official complete BrainGlobe v3 suite, with transitive versions locked.
      - brainglobe==3.0.0
      - brainglobe-atlasapi==3.0.1
      - brainglobe-heatmap==0.6.0
      - brainglobe-napari-io==0.5.0
      - brainglobe-segmentation==1.3.3
      - brainglobe-space==1.0.3
      - brainglobe-utils==0.11.2
      - brainreg[napari]==1.0.15
      - brainrender-napari==0.2.0
      - brainrender==2.2.1
      - cellfinder[napari]==1.10.1
