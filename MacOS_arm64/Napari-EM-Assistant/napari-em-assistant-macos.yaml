name: napari-em-assistant

channels:
  - conda-forge

dependencies:
  - python=3.11.13
  - pip
  - pip:
      # NumPy 2.2 stays within OpenCV 4.12's Python 3.11 compatibility range.
      - numpy==2.2.6
      - tifffile==2025.6.11
      - opencv-python-headless==4.12.0.88
      - napari==0.6.6
      - QtPy==2.4.3
      - PyQt5==5.15.11
      - napari-em-assistant==0.2.3
