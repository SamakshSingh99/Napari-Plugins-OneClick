name: empanada
channels: [conda-forge]
dependencies:
  # Empanada's published Windows guidance supports Python 3.9 and below.
  - python=3.9.23
  - pip
  - pip:
      - numpy==1.26.4
      - scipy==1.13.1
      # This matched pair predates the StringZilla dependency and therefore
      # avoids compiling a native extension with Visual C++ Build Tools.
      - albumentations==1.4.18
      - albucore==0.0.17
      - torch==2.10.0
      - torchvision==0.25.0
      - napari==0.5.6
      - PyQt5==5.15.11
      - empanada-napari==1.2.4
