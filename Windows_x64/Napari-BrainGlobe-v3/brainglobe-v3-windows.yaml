name: brainglobe-v3
channels: [conda-forge]
dependencies:
  - python=3.12.11
  - pip
  - napari=0.6.6
  - pyqt6
  # Keep the Windows DLL runtime and VTK stack under Conda's control. This
  # prevents pip from trying to build vedo/VTK dependencies from source.
  - libffi
  - vedo
  - vtk
  - pip:
      - brainglobe==3.0.0
      - brainglobe-atlasapi==3.0.1
      - brainglobe-heatmap==0.6.0
      - brainglobe-napari-io==0.5.0
      - brainglobe-segmentation==1.3.3
      - brainglobe-space==1.0.3
      - brainglobe-utils==0.11.2
      - brainreg[napari]==1.0.15
      - brainrender-napari==0.2.0
      - brainrender==2.2.1
      - cellfinder[napari]==1.10.1
