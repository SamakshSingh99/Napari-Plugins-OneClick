name: napari-n2v

channels:
  - conda-forge

dependencies:
  - python=3.9.23
  - pip
  - pip:
      # Numerical and GUI stack verified in the existing environment.
      - numpy==1.26.4
      - scipy==1.13.1
      - scikit-image==0.24.0
      - imagecodecs==2024.12.30
      - tifffile==2024.6.18
      - zarr==2.18.2
      - napari==0.5.6
      - PyQt5==5.15.11

      # Apple Silicon TensorFlow stack used by napari-N2V.
      - tensorflow-macos==2.15.0
      - tensorflow-metal==1.1.0
      - keras==2.15.0
      - tensorflow-estimator==2.15.0
      - ml-dtypes==0.2.0
      - protobuf==4.25.9

      # Install the exact Python 3.9 universal2 wheel. A version-only pin
      # allowed pip to select the Intel x86_64 wheel on an ARM64 Mac.
      - "grpcio @ https://files.pythonhosted.org/packages/9a/6b/f6761b4b6dcf0c53748415d17183c3b5277a71d251c86fb401941ab3c468/grpcio-1.59.3-cp39-cp39-macosx_10_10_universal2.whl#sha256=36636babfda14f9e9687f28d5b66d349cf88c1301154dc71c6513de2b6c88c59"

      # Noise2Void and napari plugin.
      - bioimageio.core==0.10.4
      - csbdeep==0.7.4
      - n2v==0.3.3
      - napari-time-slicer==0.5.0
      - napari-tools-menu==0.1.20
      - napari-workflows==0.2.11
      - napari-n2v==0.1.1

variables:
  TF_CPP_MIN_LOG_LEVEL: "1"
